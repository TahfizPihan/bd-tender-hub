name: Collect tenders

on:
  schedule:
    - cron: "15 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional; leave unset to skip AI step
        run: python -m scraper.collect

      - name: Commit updated data
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add docs/tenders.json data/processed_pages.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update tenders $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
