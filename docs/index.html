<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BD Tender Hub</title>
<meta name="description" content="Search Bangladesh tenders from e-GP and other sources in one place.">
<style>
:root{
  --bg:#f6f7f4; --card:#ffffff; --ink:#1b2420; --muted:#5d6b64; --line:#dfe4de;
  --accent:#0b6b4d; --accent-ink:#ffffff; --warn:#a85a00; --bad:#a32020; --ok:#0b6b4d;
  --chip:#eaf1ec;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#101512; --card:#171e1a; --ink:#e7ede9; --muted:#96a59c; --line:#27322c;
         --accent:#4cc79a; --accent-ink:#06210f; --warn:#e0a24a; --bad:#ef7b7b; --ok:#4cc79a; --chip:#1f2923; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Bengali","Kalpurush",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 48px}
header{padding:28px 0 12px}
h1{margin:0;font-size:1.6rem;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:.95rem}
.controls{display:grid;gap:10px;grid-template-columns:1fr;margin:16px 0 8px}
@media(min-width:760px){.controls{grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr}}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;
  color:var(--muted);font-size:.9rem;margin:8px 0 14px}
.bar button{width:auto;padding:6px 12px;cursor:pointer}
.list{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{font-size:1.02rem;margin:0 0 6px;line-height:1.35}
.card h2 a{color:inherit;text-decoration:none}
.card h2 a:hover{text-decoration:underline;color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.88rem}
.chip{background:var(--chip);border-radius:999px;padding:1px 10px;font-size:.8rem;color:var(--ink)}
.deadline{font-weight:600}
.open{color:var(--ok)} .soon{color:var(--warn)} .closed{color:var(--bad)} .none{color:var(--muted)}
.sum{margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.also{margin-top:6px;font-size:.82rem}
.also a{color:var(--accent)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line);border-radius:14px}
.src{margin-top:28px;font-size:.85rem;color:var(--muted)}
.src span{display:inline-block;margin-right:12px}
.src .fail{color:var(--bad)}
footer{margin-top:28px;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BD Tender Hub</h1>
    <p class="sub" id="updated">Loading tenders…</p>
  </header>

  <div class="controls">
    <input id="q" type="search" placeholder="Search title, organization… (English or বাংলা)" aria-label="Search tenders">
    <select id="status" aria-label="Status">
      <option value="active">Open now</option>
      <option value="soon">Closing in 7 days</option>
      <option value="closed">Closed</option>
      <option value="all">All</option>
    </select>
    <select id="category" aria-label="Category"><option value="">All categories</option></select>
    <select id="kind" aria-label="Type">
      <option value="">All types</option>
      <option value="public">Government (e-GP)</option>
      <option value="development">Development partners</option>
      <option value="private">Private / NGO</option>
      <option value="newspaper">Newspaper notices</option>
    </select>
    <select id="source" aria-label="Source"><option value="">All sources</option></select>
    <select id="sort" aria-label="Sort">
      <option value="deadline">Closing soonest</option>
      <option value="new">Newest first</option>
    </select>
  </div>

  <div class="bar">
    <span id="count"></span>
    <button id="csv" type="button">Download CSV</button>
  </div>

  <div class="list" id="list"></div>
  <div class="src" id="src"></div>
  <footer>
    This site is an index. Each entry links to the original notice; always confirm details,
    deadlines and fees on the official source before bidding.
  </footer>
</div>

<script>
(function () {
  var DAY = 86400000;
  var state = { all: [], meta: null };
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }

  // Deadline is a calendar date in Bangladesh; compare against end of that day (UTC+6).
  function daysLeft(t) {
    if (!t.deadline) return null;
    var end = Date.parse(t.deadline + "T23:59:59+06:00");
    if (isNaN(end)) return null;
    return Math.ceil((end - Date.now()) / DAY);
  }
  function statusOf(t) {
    var d = daysLeft(t);
    if (d === null) return "unknown";
    if (d < 0) return "closed";
    return d <= 7 ? "soon" : "open";
  }

  function load() {
    fetch("tenders.json", { cache: "no-store" }).then(function (r) { return r.json(); })
      .then(function (data) {
        state.all = data.tenders || [];
        state.meta = data;
        fillFilters();
        var g = data.generated_at ? new Date(data.generated_at) : null;
        $("updated").textContent = g
          ? "Last updated " + g.toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) +
            " · " + state.all.length + " tenders tracked"
          : "No data yet";
        renderSources();
        render();
      })
      .catch(function () {
        $("updated").textContent = "Could not load tenders.json";
        $("list").innerHTML = '<div class="empty">No data available yet. The collector has not run.</div>';
      });
  }

  function fillFilters() {
    function uniq(key) {
      var seen = {}, out = [];
      state.all.forEach(function (t) { var v = t[key]; if (v && !seen[v]) { seen[v] = 1; out.push(v); } });
      return out.sort();
    }
    uniq("category").forEach(function (v) { $("category").insertAdjacentHTML("beforeend", '<option>' + esc(v) + '</option>'); });
    uniq("source").forEach(function (v) { $("source").insertAdjacentHTML("beforeend", '<option>' + esc(v) + '</option>'); });
  }

  function filtered() {
    var q = $("q").value.trim().toLowerCase();
    var st = $("status").value, cat = $("category").value, src = $("source").value, kd = $("kind").value;
    var rows = state.all.filter(function (t) {
      if (cat && t.category !== cat) return false;
      if (src && t.source !== src) return false;
      if (kd && t.kind !== kd) return false;
      var s = statusOf(t);
      if (st === "active" && s === "closed") return false;
      if (st === "soon" && s !== "soon") return false;
      if (st === "closed" && s !== "closed") return false;
      if (q) {
        var hay = ((t.title || "") + " " + (t.organization || "") + " " + (t.summary || "") + " " + (t.location || "")).toLowerCase();
        return q.split(/\s+/).every(function (w) { return hay.indexOf(w) !== -1; });
      }
      return true;
    });
    var sort = $("sort").value;
    rows.sort(function (a, b) {
      if (sort === "new") return (b.first_seen || "").localeCompare(a.first_seen || "");
      var da = a.deadline || "9999", db = b.deadline || "9999";
      return da.localeCompare(db);
    });
    return rows;
  }

  function deadlineHtml(t) {
    var d = daysLeft(t);
    if (d === null) return '<span class="deadline none">Deadline: see notice</span>';
    var cls = d < 0 ? "closed" : d <= 7 ? "soon" : "open";
    var label = d < 0 ? "closed" : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
    return '<span class="deadline ' + cls + '">Closes ' + esc(t.deadline) + ' · ' + label + '</span>';
  }

  function render() {
    var rows = filtered();
    $("count").textContent = rows.length + " result" + (rows.length === 1 ? "" : "s");
    if (!rows.length) {
      $("list").innerHTML = '<div class="empty">' +
        (state.all.length ? "No tenders match these filters." : "No tenders collected yet.") + "</div>";
      return;
    }
    $("list").innerHTML = rows.slice(0, 300).map(function (t) {
      var also = (t.also_at || []).map(function (u, i) {
        return '<a href="' + esc(safeUrl(u)) + '" target="_blank" rel="noopener noreferrer">also listed (' + (i + 1) + ')</a>';
      }).join(" · ");
      return '<article class="card">' +
        '<h2><a href="' + esc(safeUrl(t.link)) + '" target="_blank" rel="noopener noreferrer">' + esc(t.title) + '</a></h2>' +
        '<div class="meta">' + deadlineHtml(t) +
        (t.organization ? '<span>' + esc(t.organization) + '</span>' : '') +
        '<span class="chip">' + esc(t.category || "Other") + '</span>' +
        '<span>' + esc(t.source) + (t.via === "newspaper" ? " · newspaper notice" : "") + '</span>' +
        (t.location ? '<span>' + esc(t.location) + '</span>' : '') + '</div>' +
        (t.summary ? '<p class="sum">' + esc(t.summary.slice(0, 220)) + (t.summary.length > 220 ? "…" : "") + '</p>' : '') +
        (also ? '<div class="also">' + also + '</div>' : '') +
        '</article>';
    }).join("");
    if (rows.length > 300) {
      $("list").insertAdjacentHTML("beforeend", '<div class="empty">Showing the first 300. Narrow the search to see more.</div>');
    }
  }

  function renderSources() {
    var s = (state.meta && state.meta.sources) || [];
    $("src").innerHTML = s.map(function (x) {
      var txt = x.note ? x.note : (x.ok ? x.count + " in last run" : "failed last run");
      return '<span class="' + (x.ok ? "" : "fail") + '">' + esc(x.name) + ': ' + esc(txt) + '</span>';
    }).join("");
  }

  function csvCell(v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
  function downloadCsv() {
    var cols = ["title", "organization", "category", "deadline", "source", "link"];
    var lines = [cols.join(",")].concat(filtered().map(function (t) {
      return cols.map(function (c) { return csvCell(t[c]); }).join(",");
    }));
    var blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "tenders.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  ["q", "status", "category", "kind", "source", "sort"].forEach(function (id) {
    $(id).addEventListener(id === "q" ? "input" : "change", render);
  });
  $("csv").addEventListener("click", downloadCsv);
  load();
})();
</script>
</body>
</html>
