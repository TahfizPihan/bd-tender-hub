<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BD Tender Hub</title>
  <style>
    :root {
      --bg: #edf3f0;
      --panel: #ffffff;
      --ink: #14231d;
      --muted: #5e6d66;
      --line: #dfe9e3;
      --brand: #0d6a4a;
      --brand-ink: #ffffff;
      --brand-soft: #e7f6ee;
      --open: #067a4b;
      --open-bg: #dff8eb;
      --soon: #9a5a00;
      --soon-bg: #fff0d9;
      --closed: #9b2d2d;
      --closed-bg: #fde3e3;
      --chip: #eef5f2;
      --shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    * { box-sizing: border-box; }
    html { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    body { margin: 0; background: var(--bg); }
    a { color: var(--brand); }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }

    .topbar {
      background: var(--brand);
      color: var(--brand-ink);
    }
    .topbar .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 14px;
      padding-bottom: 14px;
    }
    .topbar h1 { margin: 0; font-size: 1.5rem; }
    .meta { font-size: 0.82rem; opacity: 0.96; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0 12px;
    }
    @media (min-width: 760px) {
      .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      box-shadow: var(--shadow);
      cursor: pointer;
      color: var(--ink);
    }
    .stat strong {
      display: block;
      font-size: 1.7rem;
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .stat span { color: var(--muted); font-size: 0.8rem; }
    .stat.open strong { color: var(--open); }
    .stat.soon strong { color: var(--soon); }
    .stat.closed strong { color: var(--closed); }

    .filters {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 720px) {
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 1100px) {
      .filters { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    input, select, button {
      font: inherit;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 10px;
      min-width: 0;
    }
    button { cursor: pointer; }
    .inline-actions {
      display: flex;
      gap: 8px;
      align-items: end;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: var(--brand);
      color: var(--brand-ink);
      border-color: var(--brand);
      font-weight: 700;
    }
    .btn-secondary {
      background: transparent;
      color: var(--brand);
      border-color: var(--brand);
    }

    .toolbar {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .table-wrap {
      margin-top: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f3f7f4;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }
    tbody tr:hover { background: #f7faf8; }
    .title a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
    }
    .title a:hover { color: var(--brand); text-decoration: underline; }
    .summary {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 6px;
      line-height: 1.45;
    }
    .pill {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--ink);
      font-size: 0.75rem;
      font-weight: 700;
      margin-right: 6px;
    }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-left: 6px;
    }
    .badge.open { background: var(--open-bg); color: var(--open); }
    .badge.soon { background: var(--soon-bg); color: var(--soon); }
    .badge.closed { background: var(--closed-bg); color: var(--closed); }
    .badge.new { background: #e6f0ff; color: #1e5bd6; }
    .source-name { color: var(--muted); font-size: 0.8rem; display: block; margin-top: 4px; }
    .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.86rem;
    }
    .pager-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .pager button {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 34px;
      padding: 5px 8px;
    }
    .pager button.active {
      background: var(--brand);
      color: var(--brand-ink);
      border-color: var(--brand);
    }
    .pager button:disabled { opacity: 0.4; cursor: default; }
    footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 760px) {
      th:nth-child(1), th:nth-child(2), th:nth-child(5), th:nth-child(6), th:nth-child(7) { display: none; }
      td:nth-child(1), td:nth-child(2), td:nth-child(5), td:nth-child(6), td:nth-child(7) { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>BD Tender Hub</h1>
      <div class="meta" id="updated">Loading…</div>
    </div>
  </header>

  <main class="container">
    <section class="stats" aria-label="Tender summary">
      <button type="button" class="stat open" data-status="open"><strong id="stat-open">0</strong><span>Open</span></button>
      <button type="button" class="stat soon" data-status="soon"><strong id="stat-soon">0</strong><span>Closing soon</span></button>
      <button type="button" class="stat closed" data-status="closed"><strong id="stat-closed">0</strong><span>Closed</span></button>
      <button type="button" class="stat" data-status="all"><strong id="stat-total">0</strong><span>Total</span></button>
    </section>

    <form class="filters" id="filter-form" autocomplete="off">
      <div class="field" style="grid-column: span 2;">
        <label for="q">Search</label>
        <input id="q" type="search" placeholder="Title, organization, location..." />
      </div>
      <div class="field">
        <label for="status">Status</label>
        <select id="status">
          <option value="open">Open</option>
          <option value="soon">Closing soon</option>
          <option value="closed">Closed</option>
          <option value="all">All</option>
        </select>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category"><option value="">All categories</option></select>
      </div>
      <div class="field">
        <label for="source">Source</label>
        <select id="source"><option value="">All sources</option></select>
      </div>
      <div class="field">
        <label for="kind">Type</label>
        <select id="kind">
          <option value="">All types</option>
          <option value="public">Government (e-GP)</option>
          <option value="development">Development partner</option>
          <option value="private">Private / NGO</option>
          <option value="newspaper">Newspaper</option>
        </select>
      </div>
      <div class="field">
        <label for="location">District / location</label>
        <select id="location"><option value="">All locations</option></select>
      </div>
      <div class="field" style="grid-column: 1 / -1;">
        <div class="inline-actions">
          <button type="button" class="btn-secondary" id="reset">Reset</button>
          <button type="button" class="btn-primary" id="download">Download CSV</button>
        </div>
      </div>
    </form>

    <div class="toolbar">
      <div id="count">0 tenders</div>
      <div>
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="deadline">Closing soonest</option>
          <option value="new">Newest</option>
          <option value="source">Source</option>
        </select>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Type</th>
            <th>Tender</th>
            <th>Organization</th>
            <th>Category</th>
            <th>Published</th>
            <th>Deadline</th>
            <th>Source</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="pager" id="pager"></div>
    </div>

    <footer>
      This is an index of public notices. Confirm the deadline and conditions on the official source before bidding.
    </footer>
  </main>

  <script>
    (function () {
      const state = {
        tenders: [],
        filters: { sources: [], categories: [], types: [], locations: [] },
        page: 1,
        pageSize: 25,
        activeStatus: 'open'
      };

      const $ = (id) => document.getElementById(id);
      const kindLabel = {
        public: 'Government',
        development: 'Development',
        private: 'Private / NGO',
        newspaper: 'Newspaper'
      };

      function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      function formatDate(value) {
        if (!value) return '—';
        const d = new Date(value + 'T00:00:00+06:00');
        if (Number.isNaN(d.getTime())) return value;
        return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'Asia/Dhaka' });
      }

      function daysLeft(deadline) {
        if (!deadline) return null;
        const end = Date.parse(deadline + 'T23:59:59+06:00');
        return Number.isNaN(end) ? null : Math.ceil((end - Date.now()) / 86400000);
      }

      function statusOf(tender) {
        const left = daysLeft(tender.deadline);
        if (left === null) return 'open';
        if (left < 0) return 'closed';
        if (left <= 7) return 'soon';
        return 'open';
      }

      function buildQuery() {
        const params = new URLSearchParams();
        const q = $('q').value.trim();
        const status = $('status').value || 'open';
        const category = $('category').value;
        const source = $('source').value;
        const kind = $('kind').value;
        const location = $('location').value;
        const sort = $('sort').value;
        if (q) params.set('q', q);
        if (status) params.set('status', status);
        if (category) params.set('category', category);
        if (source) params.set('source', source);
        if (kind) params.set('kind', kind);
        if (location) params.set('location', location);
        if (sort) params.set('sort', sort);
        return params.toString();
      }

      function setFiltersFromQuery(query) {
        const p = new URLSearchParams(query);
        $('q').value = p.get('q') || '';
        $('status').value = p.get('status') || 'open';
        $('category').value = p.get('category') || '';
        $('source').value = p.get('source') || '';
        $('kind').value = p.get('kind') || '';
        $('location').value = p.get('location') || '';
        $('sort').value = p.get('sort') || 'deadline';
      }

      function applyFilters() {
        const q = $('q').value.trim().toLowerCase();
        const status = $('status').value;
        const category = $('category').value;
        const source = $('source').value;
        const type = $('kind').value;
        const location = $('location').value;
        const sort = $('sort').value;

        let rows = [...state.tenders];
        if (q) {
          rows = rows.filter((t) => {
            const hay = `${t.title || ''} ${t.organization || ''} ${t.summary || ''} ${t.location || ''} ${t.source || ''}`.toLowerCase();
            return hay.includes(q);
          });
        }
        if (status && status !== 'all') rows = rows.filter((t) => statusOf(t) === status);
        if (category) rows = rows.filter((t) => (t.category || 'Other') === category);
        if (source) rows = rows.filter((t) => (t.source || '') === source);
        if (type) rows = rows.filter((t) => (t.kind || 'public') === type);
        if (location) rows = rows.filter((t) => (t.location || '') === location);

        if (sort === 'new') {
          rows.sort((a, b) => (b.first_seen || '').localeCompare(a.first_seen || ''));
        } else if (sort === 'source') {
          rows.sort((a, b) => ((a.source || '').localeCompare(b.source || '')) || ((a.title || '').localeCompare(b.title || '')));
        } else {
          rows.sort((a, b) => {
            const da = a.deadline || '9999-12-31';
            const db = b.deadline || '9999-12-31';
            return (da > db ? 1 : -1) || (b.first_seen || '').localeCompare(a.first_seen || '');
          });
        }

        return rows;
      }

      function renderPager(totalRows) {
        const pages = Math.max(1, Math.ceil(totalRows / state.pageSize));
        if (state.page > pages) state.page = pages;
        const pageButtons = [];
        for (let i = 1; i <= pages; i++) {
          if (i === 1 || i === pages || (i >= state.page - 1 && i <= state.page + 1)) {
            pageButtons.push(`<button type="button" class="${i === state.page ? 'active' : ''}" data-page="${i}">${i}</button>`);
          }
        }
        $('pager').innerHTML = `
          <div>${state.page} / ${pages}</div>
          <div class="pager-buttons">
            <button type="button" data-page="1" ${state.page === 1 ? 'disabled' : ''}>«</button>
            <button type="button" data-page="${Math.max(1, state.page - 1)}" ${state.page === 1 ? 'disabled' : ''}>‹</button>
            ${pageButtons.join('')}
            <button type="button" data-page="${Math.min(pages, state.page + 1)}" ${state.page === pages ? 'disabled' : ''}>›</button>
            <button type="button" data-page="${pages}" ${state.page === pages ? 'disabled' : ''}>»</button>
          </div>
        `;
      }

      function renderRows(rows) {
        const start = (state.page - 1) * state.pageSize;
        const slice = rows.slice(start, start + state.pageSize);
        $('count').textContent = `${rows.length} tender${rows.length === 1 ? '' : 's'}`;

        if (!slice.length) {
          $('rows').innerHTML = '<tr><td colspan="9" class="empty">No tenders match these filters.</td></tr>';
          renderPager(0);
          return;
        }

        $('rows').innerHTML = slice.map((t, idx) => {
          const left = daysLeft(t.deadline);
          const status = statusOf(t);
          const statusClass = status === 'closed' ? 'closed' : status === 'soon' ? 'soon' : 'open';
          const deadlineText = left === null ? 'Not stated' : left < 0 ? 'Closed' : left === 0 ? 'Closes today' : `${left} day${left === 1 ? '' : 's'} left`;
          const kind = kindLabel[t.kind] || 'Other';
          const title = esc(t.title || 'Untitled tender');
          const org = esc(t.organization || '—');
          const category = esc(t.category || 'Other');
          const source = esc(t.source || 'Unknown');
          const location = esc(t.location || '');
          const summary = t.summary ? `<span class="summary">${esc(t.summary.slice(0, 140))}${t.summary.length > 140 ? '…' : ''}</span>` : '';
          const link = t.link ? `<a href="${esc(t.link)}" target="_blank" rel="noopener noreferrer">Open</a>` : '—';
          const seenNew = (Date.now() - new Date(t.first_seen || Date.now()).getTime()) < 86400000 ? '<span class="badge new">NEW</span>' : '';

          return `
            <tr>
              <td>${start + idx + 1}</td>
              <td><span class="pill">${kind}</span></td>
              <td class="title">
                <a href="${esc(t.link || '#')}" target="_blank" rel="noopener noreferrer">${title}</a>
                ${seenNew}
                ${summary}
              </td>
              <td>${org}${location ? `<span class="source-name">${location}</span>` : ''}</td>
              <td><span class="pill">${category}</span></td>
              <td>${formatDate(t.published || t.first_seen)}</td>
              <td>
                <span>${formatDate(t.deadline)}</span>
                <span class="badge ${statusClass}">${deadlineText}</span>
              </td>
              <td>${source}</td>
              <td>${link}</td>
            </tr>
          `;
        }).join('');

        renderPager(rows.length);
      }

      function renderSummary(rows) {
        const open = rows.filter((t) => statusOf(t) === 'open').length;
        const soon = rows.filter((t) => statusOf(t) === 'soon').length;
        const closed = rows.filter((t) => statusOf(t) === 'closed').length;
        $('stat-open').textContent = open;
        $('stat-soon').textContent = soon;
        $('stat-closed').textContent = closed;
        $('stat-total').textContent = rows.length;
      }

      function loadFilters() {
        const fill = (id, values) => {
          const el = $(id);
          const current = el.value;
          el.innerHTML = id === 'category' ? '<option value="">All categories</option>' : id === 'source' ? '<option value="">All sources</option>' : id === 'location' ? '<option value="">All locations</option>' : '<option value="">All types</option>';
          values.filter(Boolean).forEach((value) => {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            el.appendChild(option);
          });
          if (current) el.value = current;
        };

        fill('category', state.filters.categories);
        fill('source', state.filters.sources);
        fill('location', state.filters.locations);
      }

      function fetchFilters() {
        fetch('/api/filters', { cache: 'no-store' })
          .then((r) => r.json())
          .then((data) => {
            state.filters = data;
            loadFilters();
          })
          .catch(() => {
            console.warn('Could not load filters');
          });
      }

      function fetchTenders() {
        const q = buildQuery();
        const url = '/api/tenders' + (q ? `?${q}` : '');
        fetch(url, { cache: 'no-store' })
          .then((r) => r.json())
          .then((data) => {
            const rows = Array.isArray(data.tenders) ? data.tenders : [];
            state.tenders = rows;
            state.page = 1;
            const filtered = applyFilters();
            renderSummary(filtered);
            renderRows(filtered);
            const g = new Date();
            $('updated').textContent = `Updated ${g.toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Dhaka' })}`;
          })
          .catch(() => {
            $('rows').innerHTML = '<tr><td colspan="9" class="empty">Could not load data from the backend.</td></tr>';
          });
      }

      function resetFilters() {
        $('q').value = '';
        $('status').value = 'open';
        $('category').value = '';
        $('source').value = '';
        $('kind').value = '';
        $('location').value = '';
        $('sort').value = 'deadline';
        fetchTenders();
      }

      document.querySelectorAll('.stat').forEach((button) => {
        button.addEventListener('click', () => {
          const status = button.dataset.status;
          $('status').value = status;
          fetchTenders();
        });
      });

      ['q', 'status', 'category', 'source', 'kind', 'location', 'sort'].forEach((id) => {
        $(id).addEventListener('input', () => fetchTenders());
        $(id).addEventListener('change', () => fetchTenders());
      });

      $('reset').addEventListener('click', resetFilters);
      $('download').addEventListener('click', () => {
        const rows = applyFilters();
        const csv = ['title,organization,category,status,deadline,source,link'];
        rows.forEach((t) => {
          csv.push(`"${(t.title || '').replace(/"/g, '""')}","${(t.organization || '').replace(/"/g, '""')}","${(t.category || 'Other').replace(/"/g, '""')}","${statusOf(t)}","${t.deadline || ''}","${(t.source || '').replace(/"/g, '""')}","${(t.link || '').replace(/"/g, '""')}"`);
        });
        const blob = new Blob([csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = 'tenders.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });

      $('pager').addEventListener('click', (event) => {
        const btn = event.target.closest('[data-page]');
        if (!btn) return;
        const page = Number(btn.dataset.page);
        if (!page || Number.isNaN(page)) return;
        state.page = page;
        renderRows(applyFilters());
      });

      setFiltersFromQuery(window.location.search);
      fetchFilters();
      fetchTenders();
    })();
  </script>
</body>
</html>
