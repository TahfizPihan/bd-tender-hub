<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BD Tender Hub | Tender Details</title>
  <style>
    :root {
      --bg: #eef4f1;
      --panel: #ffffff;
      --line: #dfe9e3;
      --ink: #183027;
      --muted: #587066;
      --brand: #0b6a4a;
      --brand-ink: #ffffff;
      --brand-soft: #e7f5ee;
      --open: #0b7a49;
      --open-bg: #dcf7ea;
      --soon: #B06400;
      --soon-bg: #fff0d8;
      --closed: #9c2d2d;
      --closed-bg: #fce4e4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .topbar { background: var(--brand); color: var(--brand-ink); }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 16px 50px; }
    .topbar .container { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0; }
    h1 { margin: 0; font-size: 1.4rem; }
    .link-btn {
      display: inline-flex; align-items: center; justify-content: center; background: var(--brand-ink); color: var(--brand); border: none; padding: 9px 14px; border-radius: 10px; text-decoration: none; font-weight: 700;
    }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 18px; }
    .title-row { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    h2 { margin: 0 0 8px; font-size: clamp(1.2rem,2vw,2rem); line-height: 1.3; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--muted); font-size: 0.86rem; margin-bottom: 12px; }
    .badge { display: inline-flex; align-items: center; padding: 5px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
    .badge.open { background: var(--open-bg); color: var(--open); }
    .badge.soon { background: var(--soon-bg); color: var(--soon); }
    .badge.closed { background: var(--closed-bg); color: var(--closed); }
    .detail-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
    @media (min-width: 840px) { .detail-grid { grid-template-columns: 2fr 1fr; } }
    .label { color: var(--muted); display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; font-weight: 700; }
    .value { font-size: 1rem; }
    .summary { line-height: 1.7; color: #244236; }
    .empty { color: var(--muted); padding: 40px 0; }
    .btn { display: inline-block; background: var(--brand); color: var(--brand-ink); padding: 10px 16px; border-radius: 10px; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>BD Tender Hub</h1>
      <a href="/" class="link-btn">Back to tenders</a>
    </div>
  </header>

  <main class="container">
    <div id="detail" class="card" style="margin-top: 20px;"></div>
  </main>

  <script>
    const detailRoot = document.getElementById('detail');
    const id = location.pathname.split('/').filter(Boolean).pop();

    fetch(`/api/tender/${encodeURIComponent(id)}`, { cache: 'no-store' })
      .then((res) => res.json())
      .then((data) => {
        const tender = data.tender;
        if (!tender) {
          detailRoot.innerHTML = '<div class="empty">Tender not found.</div>';
          return;
        }
        const d = new Date(tender.deadline + 'T00:00:00+06:00');
        const left = tender.deadline ? Math.ceil((d - Date.now()) / 86400000) : null;
        const status = !tender.deadline ? 'open' : left < 0 ? 'closed' : left <= 7 ? 'soon' : 'open';
        const statusLabel = status === 'closed' ? 'Closed' : status === 'soon' ? 'Closing soon' : 'Open';
        detailRoot.innerHTML = `
          <div class="title-row">
            <div>
              <h2>${(tender.title || 'Untitled tender').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</h2>
              <div class="meta">
                <span class="badge ${status}">${statusLabel}</span>
                <span>${(tender.source || 'Unknown source')}</span>
                <span>${(tender.kind || 'public')}</span>
              </div>
            </div>
            ${tender.link ? `<a class="btn" href="${tender.link}" target="_blank" rel="noopener noreferrer">Open official notice</a>` : ''}
          </div>

          <div class="detail-grid">
            <div>
              <div class="card" style="padding: 16px; margin-top: 8px;">
                <span class="label">Summary</span>
                <div class="summary">${(tender.summary || 'No summary available.').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</div>
              </div>
            </div>
            <div>
              <div class="card" style="padding: 16px; margin-top: 8px;">
                <div style="margin-bottom: 16px;"><span class="label">Organization</span><div class="value">${(tender.organization || '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</div></div>
                <div style="margin-bottom: 16px;"><span class="label">Category</span><div class="value">${(tender.category || 'Other').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</div></div>
                <div style="margin-bottom: 16px;"><span class="label">Deadline</span><div class="value">${tender.deadline || 'Not stated'}</div></div>
                <div style="margin-bottom: 16px;"><span class="label">Published</span><div class="value">${tender.published || 'Not stated'}</div></div>
                <div style="margin-bottom: 16px;"><span class="label">Location</span><div class="value">${(tender.location || 'Not stated').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</div></div>
              </div>
            </div>
          </div>
        `;
      })
      .catch(() => {
        detailRoot.innerHTML = '<div class="empty">Unable to load tender details.</div>';
      });
  </script>
</body>
</html>
